name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance:
    name: Governance release unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - run: python -m pip install pytest pyyaml tomlkit Flask PyJWT cryptography
      - run: python -m pytest tests/test-ai-review-policy.py
      - name: AFK contract test
        shell: bash
        run: bash tests/test-afk-contract.sh
      - name: Server development worktree tests
        shell: bash
        run: bash tests/test-dev-worktree.sh
      - name: Server development pre-push tests
        shell: sh
        run: sh tests/test-pre-push.sh
      - name: Server development commit-msg tests
        shell: sh
        run: sh tests/test-commit-msg.sh
      - name: Server development policy audit tests
        shell: bash
        run: bash tests/test-dev-policy-audit.sh
      - name: Server development dev-host tests
        shell: bash
        run: bash tests/test-dev-host.sh
      - name: Server development changelog tests
        shell: sh
        run: sh tests/test-dev-changelog.sh
      - name: Server development installer tests
        shell: sh
        run: sh tests/test-install.sh
      - name: Review Sentinel unit tests
        shell: bash
        run: PYTHONPATH=review-sentinel python -m unittest discover -s review-sentinel/tests
      - name: Review Sentinel installer test
        shell: sh
        run: sh review-sentinel/tests/test-install.sh
