[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "server-review-sentinel"
version = "0.1.0"
description = "Review-only GitHub PR queue for the server development consensus"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "PyJWT>=2.8,<3",
  "cryptography>=42,<47",
]

[project.scripts]
review-sentinel = "review_sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["review_sentinel"]
